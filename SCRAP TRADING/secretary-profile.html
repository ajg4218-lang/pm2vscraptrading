<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PM2V Scrap Trading</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .edit-mode #fieldFullName p { display: none; }
        .edit-mode #fieldFullName input { display: block; }
        .detail-field input { display: none; width: 100%; padding: 8px; border: 1px solid #e0e0e0; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="pm2v-logo.png" alt="PM2V Logo" class="sidebar-logo">
                <div>
                    <h2>PM2V Scrap</h2>
                    <p>Inventory System</p>
                </div>
            </div>

            <div class="user-profile">
                <div class="avatar" id="sidebarAvatar"></div>
                <div>
                    <h3 id="sidebarName">Secretary</h3>
                    <p id="sidebarRole">Secretary</p>
                </div>
            </div>

            <nav class="navigation">
                <ul class="menu">
                    <li><a href="secretary-dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a></li>
                    <li><a href="secretary-physical-inventory.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Physical Inventory</a></li>
                    <li><a href="secretary-transactions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Transactions</a></li>
                    <li><a href="secretary-reports.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Reports</a></li>
                    <li class="active"><a href="secretary-profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="logout-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Standard Heading -->
            <header class="header">
                <h1>Profile</h1>
                <div class="header-date">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="currentDate"></span>
                    <span style="margin: 0 6px; color: #cbd5e1;">|</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="currentTime"></span>
                </div>
            </header>
            
            <!-- Profile Card -->
            <section class="profile-card-section profile-page" id="profileRoot">
                <div class="profile-header-card">
                    <div class="profile-header-main">
                        <div class="profile-avatar" id="userAvatar"></div>
                        <div class="profile-identity">
                            <h2 id="profileHeaderName"></h2>
                            <div class="profile-badges">
                                <span class="status-badge role-staff-badge" id="profileRoleBadge"></span>
                                <span class="status-badge status-active" id="profileStatusBadge"></span>
                            </div>
                            <div class="profile-header-email" id="profileHeaderEmail"></div>
                        </div>
                    </div>
                </div>

                <div class="profile-sections">
                    <section class="profile-section-card">
                        <h3>Personal Information</h3>
                        <div class="profile-fields">
                            <div class="detail-field" id="fieldFullName">
                                <label>Full Name</label>
                                <p id="userName"></p>
                            </div>
                        </div>
                    </section>

                    <section class="profile-section-card">
                        <h3>Account Information</h3>
                        <div class="profile-fields">
                            <div class="detail-field">
                                <label>Email</label>
                                <p id="profileDetailEmail"></p>
                            </div>
                            <div class="detail-field">
                                <label>Role</label>
                                <p id="profileAccountRole"></p>
                            </div>
                            <div class="detail-field">
                                <label>Status</label>
                                <p id="profileAccountStatus"></p>
                            </div>
                        </div>
                    </section>

                    <section class="profile-section-card">
                        <h3>Activity Information</h3>
                        <div class="profile-fields">
                            <div class="detail-field">
                                <label>Member Since</label>
                                <p id="profileCreatedAt" class="profile-muted"></p>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="profile-actions" style="display: flex; gap: 10px; margin-top: 18px; justify-content: flex-start;">
                    <button class="btn-primary" id="editProfileBtn" style="padding: 12px 24px; border-radius: 10px;">Edit Profile</button>
                    <button class="btn-secondary" id="changePasswordBtn" style="padding: 12px 24px; border-radius: 10px;">Change Password</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Password Change Modal -->
    <div class="password-modal" id="passwordModal">
        <div class="password-modal-content">
            <h3>Change Password</h3>
            <div class="success-message" id="successMessage">
                Password changed successfully!
            </div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Change Password</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="profile.js"></script>
    <script type="module" src="authRedirect.js"></script>
    <script>
        const dateEl = document.getElementById('currentDate');
        if (dateEl) {
            dateEl.textContent = new Date().toLocaleDateString('en-US', { timeZone:'Asia/Manila', weekday:'long', year:'numeric', month:'long', day:'numeric' });
        }
        function updatePhTime() {
            const timeEl = document.getElementById('currentTime');
            if (timeEl) {
                timeEl.textContent = new Date().toLocaleTimeString('en-US', { timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', second:'2-digit' });
            }
        }
        updatePhTime();
        setInterval(updatePhTime, 1000);
    </script>
</body>
</html>
