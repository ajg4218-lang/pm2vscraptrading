<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - PM2V Scrap Trading</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="pm2v-logo.png" alt="PM2V Logo" class="sidebar-logo">
            </div>

            <div class="user-profile">
                <div class="avatar" id="sidebarAvatar"></div>
                <div>
                    <h3 id="sidebarName">Owner</h3>
                    <p id="sidebarRole">Owner</p>
                </div>
            </div>

            <nav class="navigation">
                <ul class="menu">
                    <li><a href="owner-dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a></li>
                    <li><a href="owner-physical-inventory.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Physical Inventory</a></li>
                    <li class="active"><a href="transactions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Transactions</a></li>
                    <li><a href="owner-reports.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Reports</a></li>
                    <li><a href="owner-user-management.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>User Management</a></li>
                    <li><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="logout-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Standard Heading -->
            <header class="header">
                <h1>Transactions</h1>
                <div class="header-date">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="currentDate"></span>
                    <span style="margin: 0 6px; color: #cbd5e1;">|</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="currentTime"></span>
                </div>
            </header>

            <!-- Add Transaction Section -->
            <section class="add-item-section" style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 700;">Record New Sale</h3>
                
                <form id="transactionForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Item Name</label>
                        <select id="transItemName" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                            <option value="">Select Item from Inventory</option>
                            <!-- Populated from inventory -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Category</label>
                        <input type="text" id="transCategory" readonly style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f7fafc;">
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Quantity Sold (kg)</label>
                        <input type="number" id="transQty" placeholder="0.00" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Buyer / Collector Name</label>
                        <input type="text" id="transBuyer" placeholder="Enter buyer name" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Notes</label>
                        <textarea id="transNotes" placeholder="Additional details..." style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; height: 80px;"></textarea>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568;">Upload Receipt Receipt (Image or PDF)</label>
                        <input type="file" id="transReceiptFile" accept="image/*,application/pdf" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                        
                        <!-- Preview Section -->
                        <div id="receiptPreviewContainer" style="display: none; margin-top: 12px; padding: 12px; border: 1px dashed #cbd5e0; border-radius: 8px; background: #f8fafc; position: relative;">
                            <p style="font-size: 12px; font-weight: 600; color: #718096; margin-bottom: 8px;">File Preview:</p>
                            <img id="receiptPreviewImage" src="" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 4px; display: none;">
                            <div id="receiptPdfPreview" style="display: none; padding: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 4px; align-items: center; gap: 10px;">
                                <span style="font-size: 24px;">📄</span>
                                <span id="receiptFileName" style="font-size: 14px; color: #4a5568;">filename.pdf</span>
                            </div>
                            <button type="button" id="btnRemoveReceipt" style="position: absolute; top: 12px; right: 12px; padding: 4px 8px; background: #feb2b2; color: #9b2c2c; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700;">Remove</button>
                        </div>
                    </div>
                    <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 8px;">
                        <button type="submit" id="btnSaveTransaction" style="padding: 12px 24px; background: #166734; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 15px;">Save Transaction</button>
                    </div>
                </form>
            </section>
            
            <!-- Transactions Table -->
            <section class="table-section">
                <div style="padding: 24px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 18px; font-weight: 700; color: #1a202c; margin: 0;">Transaction History</h3>
                </div>
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Qty Sold</th>
                            <th>Buyer Name</th>
                            <th>Uploaded Date & Time</th>
                            <th>Receipt</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                        <!-- Data will be loaded from transactions.js -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script type="module" src="transactions.js"></script>
    <script type="module" src="authRedirect.js"></script>

    <!-- Receipt Modal for Enlarging Images -->
    <div id="receiptModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="position: relative; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center;">
            <img id="modalImage" src="" style="max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="margin-top: 20px; display: flex; gap: 15px;">
                <a id="downloadReceipt" href="" download="receipt.jpg" style="padding: 10px 20px; background: #166734; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px;">Download Receipt</a>
                <button onclick="document.getElementById('receiptModal').style.display = 'none'" style="padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">Close</button>
            </div>
        </div>
    </div>
    <script>
        const dateEl = document.getElementById('currentDate');
        if (dateEl) {
            dateEl.textContent = new Date().toLocaleDateString('en-US', { timeZone:'Asia/Manila', weekday:'long', year:'numeric', month:'long', day:'numeric' });
        }
        function updatePhTime() {
            const timeEl = document.getElementById('currentTime');
            if (timeEl) {
                timeEl.textContent = new Date().toLocaleTimeString('en-US', { timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', second:'2-digit' });
            }
        }
        updatePhTime();
        setInterval(updatePhTime, 1000);
    </script>
</body>
</html>
